name: Deploy

on:
  push:
    tags: ['v*']

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            cf-news-frontend/package-lock.json
            cf-news-worker/package-lock.json

      - name: Generate wrangler.toml
        run: |
          cd cf-news-worker
          export KV_NAMESPACE_ID="${{ secrets.KV_NAMESPACE_ID }}"
          export ZONE_ID="${{ secrets.ZONE_ID }}"
          export ROUTE_PATTERN="${{ secrets.ROUTE_PATTERN }}"
          envsubst < wrangler.toml.example > wrangler.toml

      - name: Build frontend
        run: |
          cd cf-news-frontend
          npm ci
          npm run build
          mkdir -p ../cf-news-worker/public
          rm -rf ../cf-news-worker/public/*
          cp -r dist/* ../cf-news-worker/public/

      - name: Deploy Worker
        run: |
          cd cf-news-worker
          npm ci
          npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

      - name: Push secrets to Cloudflare
        run: |
          cd cf-news-worker
          echo "${{ secrets.JWT_SECRET }}" | npx wrangler secret put JWT_SECRET
          echo "${{ secrets.OPENROUTER_API_KEY }}" | npx wrangler secret put OPENROUTER_API_KEY
          echo "${{ secrets.NVIDIA_API_KEY }}" | npx wrangler secret put NVIDIA_API_KEY
          echo "${{ secrets.MANGO_API_KEY }}" | npx wrangler secret put MANGO_API_KEY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
