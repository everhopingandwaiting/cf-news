name: Deploy

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            cf-news-frontend/package-lock.json
            cf-news-worker/package-lock.json

      - name: Generate wrangler.toml
        run: |
          cd cf-news-worker
          export KV_NAMESPACE_ID="${{ secrets.KV_NAMESPACE_ID }}"
          export ZONE_ID="${{ secrets.ZONE_ID }}"
          export ROUTE_PATTERN="${{ secrets.ROUTE_PATTERN }}"
          envsubst < wrangler.toml.example > wrangler.toml

      - name: Build frontend
        env:
          VITE_BUILD_TIME: "${{ github.event.head_commit.timestamp }}"
          VITE_BUILD_PLATFORM: "GitHub Actions"
          VITE_BUILD_VERSION: "${{ github.ref_name }}"
          VITE_BUILD_COMMIT: "${{ github.sha }}"
        run: |
          cd cf-news-frontend
          npm ci
          npm run build
          mkdir -p ../cf-news-worker/public
          rm -rf ../cf-news-worker/public/*
          cp -r dist/* ../cf-news-worker/public/

      - name: Deploy Worker
        run: |
          cd cf-news-worker
          npm ci
          npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

      - name: Upload build artifacts to GitHub Release
        run: |
          cd cf-news-worker
          zip -r ../frontend-build-${{ github.ref_name }}.zip public/
        shell: bash

      - name: Attach archive to release
        uses: softprops/action-gh-release@v2
        with:
          files: frontend-build-${{ github.ref_name }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push secrets to Cloudflare
        run: |
          cd cf-news-worker
          for key in JWT_SECRET OPENROUTER_API_KEY NVIDIA_API_KEY MANGO_API_KEY GROQ_API_KEY TURNSTILE_SECRET; do
            value="${!key}"
            if [ -n "$value" ]; then
              echo "$value" | npx wrangler secret put "$key"
            fi
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          MANGO_API_KEY: ${{ secrets.MANGO_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
